name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check site files
        run: |
          test -f index.html || { echo "index.html غير موجود في جذر المستودع"; exit 1; }

      - name: Signing key (created once, then reused so updates install over the old app)
        run: |
          if [ ! -f apk-keystore.jks ]; then
            keytool -genkeypair -keystore apk-keystore.jks -alias qm -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass qmpass123 -keypass qmpass123 -dname "CN=Quran Muthabbit"
            git config user.name "apk-bot"
            git config user.email "apk-bot@users.noreply.github.com"
            git add apk-keystore.jks
            git commit -m "add apk signing key"
            git push || true
          fi
          mkdir -p /tmp/apk/www
          cp apk-keystore.jks /tmp/apk/ks.jks

      - name: Copy site into app
        run: |
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='apk-keystore.jks' --exclude='*.apk' ./ /tmp/apk/www/

      - name: Create Android project
        working-directory: /tmp/apk
        run: |
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'CFG'
          {"appId":"com.quran.muthabbit","appName":"مُثبِّت القرآن","webDir":"www","server":{"androidScheme":"https"}}
          CFG
          npx cap add android
          D=android/app/src/main/java/com/quran/muthabbit
          mkdir -p $D
          cat > $D/PdfScanPlugin.java <<'JAVA1'
          package com.quran.muthabbit;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          @CapacitorPlugin(name = "PdfScan")
          public class PdfScanPlugin extends Plugin {
            private final List<Uri> pending = new ArrayList<>();

            @Override
            public void load() {
              collect(getActivity().getIntent());
            }

            @Override
            protected void handleOnNewIntent(Intent intent) {
              super.handleOnNewIntent(intent);
              collect(intent);
            }

            @SuppressWarnings("deprecation")
            private void collect(Intent i) {
              if (i == null || i.getAction() == null) return;
              String a = i.getAction();
              synchronized (pending) {
                if (Intent.ACTION_SEND.equals(a)) {
                  Uri u = i.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (u != null) pending.add(u);
                } else if (Intent.ACTION_SEND_MULTIPLE.equals(a)) {
                  ArrayList<Uri> l = i.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                  if (l != null) pending.addAll(l);
                } else if (Intent.ACTION_VIEW.equals(a) && i.getData() != null) {
                  pending.add(i.getData());
                }
              }
            }

